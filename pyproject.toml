[project]
name = "bus-stop-processor"
version = "0.2.0"
description = "Processes bus stop amenity data."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
    "geopandas>=0.14.3",
    "shapely>=2.0.4",
    "geohash2>=1.1.0",
    "jinja2>=3.1.3",
    "sqlalchemy>=2.0.44",
    "geoalchemy2>=0.18.0",
    "psycopg2-binary>=2.9.9",
    "haversine",
    "matplotlib>=3.10.7",
    "ipykernel>=7.1.0",
    "osmnx>=2.0.7",
    "scikit-learn>=1.7.2",
    "pygeohash>=3.2.2",
    "pyogrio>=0.12.1",
    "bs4>=0.0.2",
    "cloudscraper>=1.2.71",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "osmnx>=2.0.7"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
